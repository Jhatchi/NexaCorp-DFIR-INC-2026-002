# Auditd watches required by Wazuh rule 100205 (cron persistence detection).
#
# Drop this file into /etc/audit/rules.d/ on every agent, then reload:
#   sudo cp auditd-config.conf /etc/audit/rules.d/cron-persistence.rules
#   sudo augenrules --load
#
# These watches tag every file-write event in the standard cron locations
# with key="cron_persistence", which rule 100205 (in 100205-cron-persistence-new.xml)
# fires on. Negative match on /usr/bin/crontab in the Wazuh rule allows
# legitimate users to edit their crontab without triggering alerts, while any
# direct file write to /etc/cron.d/ (the technique observed in INC-2026-002
# via /etc/cron.d/svc-updater) raises a level 12 alert.
#
# Rationale and full mapping to Phase 1 finding I7 are documented in
# detection/workflow.md.

-w /etc/cron.d/ -p wa -k cron_persistence
-w /etc/crontab -p wa -k cron_persistence
-w /var/spool/cron/ -p wa -k cron_persistence
