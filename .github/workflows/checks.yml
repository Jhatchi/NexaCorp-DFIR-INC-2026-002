name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli
      - name: Lint markdown files
        run: |
          markdownlint '**/*.md' --ignore node_modules \
            --disable MD013 MD033 MD041 MD024 MD022 MD031 MD032 MD060 MD040 MD025 MD036 MD034 MD038

  xml-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Validate Wazuh rule XML
        run: |
          set -e
          for f in detection/*.xml; do
            echo "Validating $f"
            xmllint --noout "$f"
          done

  typography:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce zero em-dash and en-dash
        run: |
          if grep -rPn "[\x{2013}\x{2014}]" \
              --exclude-dir=node_modules \
              --exclude-dir=.git \
              --binary-files=without-match \
              . ; then
            echo "::error::Forbidden em-dash (U+2014) or en-dash (U+2013) detected. Use ASCII hyphen-minus (-) or rephrase."
            exit 1
          fi
          echo "Typography check passed : zero em-dash, zero en-dash."
